# nginx site config for the Angular SPA (replaces /etc/nginx/conf.d/default.conf in nginxinc/nginx-unprivileged).
# The image runs as a non-root user and listens on 8080; the main nginx.conf of the image stays untouched.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # nginx does NOT inherit add_header into a location that defines its own add_header,
    # so the security header is repeated in every location below.

    # liveness/readiness probe target: no file access, no logging
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # runtime IdP configuration - mounted from a ConfigMap and swapped per IdP: never cache it
    location = /config.json {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # the shell references hashed bundles; it must always be fetched fresh after a deploy
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # hashed assets (outputHashing: all in the production build) are immutable.
    # Deliberately without 'always': a 404 for a stale chunk (e.g. from an old pod during a rolling
    # update) must not be cached by the browser for a year.
    location ~* \.(?:js|css|woff2?|ttf|ico|png|svg|jpe?g|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback: deep links such as /profile or /callback?code=... are handled by the Angular router
    location / {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ /index.html;
    }
}
