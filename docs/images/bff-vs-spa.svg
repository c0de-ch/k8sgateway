<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="850" viewBox="0 0 1300 850" role="img" aria-labelledby="title desc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">SPA versus BFF: where the tokens live</title>
  <desc id="desc">Left: Angular SPA keeps tokens in the browser and calls APIs directly with a Bearer header. Right: Next.js BFF keeps tokens in an encrypted http-only cookie session on the server; the browser calls /api/bff/* and the server forwards the Bearer token.</desc>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#2563eb"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#16a34a"/></marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#d97706"/></marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6b7280"/></marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#1f2937"/></marker>
  </defs>
  <!-- light canvas so the diagram stays legible on GitHub dark mode -->
  <rect x="0.5" y="0.5" width="1299" height="849" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="50" font-size="24" fill="#1f2937" font-weight="700">Where do the tokens live? SPA vs. BFF</text>
  <text x="40" y="78" font-size="15" fill="#6b7280">Same IdP, same JWT validation in the API. The patterns differ in who holds the tokens and who talks to the IdP.</text>

  <!-- panel A: SPA -->
  <rect x="40" y="110" width="590" height="700" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="40" y="110" width="590" height="54" rx="16" fill="#eff6ff" stroke="#eff6ff" stroke-width="1"/>
  <rect x="40" y="140" width="590" height="24" rx="0" fill="#eff6ff" stroke="#eff6ff" stroke-width="1"/>
  <text x="60" y="136" font-size="17" fill="#2563eb" font-weight="700">A · SPA — Angular (angular-oauth2-oidc)</text>
  <text x="60" y="155" font-size="12.5" fill="#6b7280">public client · tokens live in the browser</text>
  <rect x="70" y="195" width="300" height="56" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="86" y="219" font-size="15" fill="#16a34a" font-weight="700">IdP</text>
  <text x="86" y="238" font-size="12" fill="#6b7280">mock · Keycloak · Entra ID · Oracle IAM</text>
  <rect x="70" y="320" width="240" height="150" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="86" y="346" font-size="15" fill="#1f2937" font-weight="700">Browser</text>
  <text x="86" y="368" font-size="12.5" fill="#1f2937">Angular SPA (static files, nginx)</text>
  <text x="86" y="386" font-size="12.5" fill="#1f2937">tokens in JavaScript memory</text>
  <rect x="86" y="422" width="208" height="34" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="190.0" y="443.32" font-size="12" fill="#d97706" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">access · id · refresh token</text>
  <rect x="420" y="320" width="190" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="436" y="346" font-size="14" fill="#2563eb" font-weight="700">REST / GraphQL API</text>
  <text x="436" y="368" font-size="12" fill="#1f2937">validates the JWT:</text>
  <text x="436" y="385" font-size="12" fill="#1f2937">signature (JWKS), iss, aud,</text>
  <text x="436" y="402" font-size="12" fill="#1f2937">exp, roles → 200 / 401 / 403</text>
  <line x1="130" y1="320" x2="130" y2="251" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <g><circle cx="130" cy="285.5" r="12" fill="#2563eb"/><text x="130" y="290.0" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text></g>
  <line x1="200" y1="251" x2="200" y2="320" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>
  <g><circle cx="200" cy="285.5" r="12" fill="#d97706"/><text x="200" y="290.0" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text></g>
  <line x1="310" y1="395" x2="420" y2="395" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>
  <g><circle cx="365.0" cy="395" r="12" fill="#d97706"/><text x="365.0" y="399.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text></g>
  <path d="M500,320 V223.0 H370" fill="none" stroke="#16a34a" stroke-width="1.8" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#arr-green)"/>
  <g><circle cx="500" cy="279.5" r="12" fill="#16a34a"/><text x="500" y="284.0" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text></g>
  <text x="516" y="283.5" font-size="12" fill="#16a34a">JWKS</text>
  <g><circle cx="82" cy="502" r="10" fill="#2563eb"/><text x="82" y="506.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text></g>
  <text x="102" y="506" font-size="12.5" fill="#1f2937">redirect to /authorize — code flow with PKCE, state and nonce (no secret)</text>
  <g><circle cx="82" cy="526" r="10" fill="#d97706"/><text x="82" y="530.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text></g>
  <text x="102" y="530" font-size="12.5" fill="#1f2937">POST /token → access, id and refresh tokens land in the browser (CORS)</text>
  <g><circle cx="82" cy="550" r="10" fill="#d97706"/><text x="82" y="554.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text></g>
  <text x="102" y="554" font-size="12.5" fill="#1f2937">every call: Authorization: Bearer &lt;access_token&gt;, added by an interceptor</text>
  <g><circle cx="82" cy="574" r="10" fill="#16a34a"/><text x="82" y="578.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text></g>
  <text x="102" y="578" font-size="12.5" fill="#1f2937">API fetches JWKS once and validates iss, aud, exp, signature and roles</text>
  <text x="70" y="648" font-size="14" fill="#16a34a" font-weight="700">Pros</text>
  <text x="70" y="671" font-size="12.5" fill="#1f2937">+ static files: nginx, any CDN</text>
  <text x="70" y="691" font-size="12.5" fill="#1f2937">+ no server state, no session</text>
  <text x="70" y="711" font-size="12.5" fill="#1f2937">+ tokens visible → easy to debug</text>
  <text x="70" y="731" font-size="12.5" fill="#1f2937">+ talks to any API directly</text>
  <text x="350" y="648" font-size="14" fill="#d97706" font-weight="700">Cons</text>
  <text x="350" y="671" font-size="12.5" fill="#1f2937">– tokens readable by JavaScript (XSS)</text>
  <text x="350" y="691" font-size="12.5" fill="#1f2937">– refresh token lives in the browser</text>
  <text x="350" y="711" font-size="12.5" fill="#1f2937">– CORS needed on every API</text>
  <text x="350" y="731" font-size="12.5" fill="#1f2937">– public client: cannot keep a secret</text>
  <text x="70" y="775" font-size="12.5" fill="#6b7280" font-style="italic">Use when the UI is a pure static frontend and the APIs are yours.</text>

  <!-- panel B: BFF -->
  <rect x="670" y="110" width="590" height="700" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <rect x="670" y="110" width="590" height="54" rx="16" fill="#eff6ff" stroke="#eff6ff" stroke-width="1"/>
  <rect x="670" y="140" width="590" height="24" rx="0" fill="#eff6ff" stroke="#eff6ff" stroke-width="1"/>
  <text x="690" y="136" font-size="17" fill="#2563eb" font-weight="700">B · BFF — Next.js (openid-client, server session)</text>
  <text x="690" y="155" font-size="12.5" fill="#6b7280">confidential client · tokens stay on the server</text>
  <rect x="900" y="195" width="330" height="56" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="916" y="219" font-size="15" fill="#16a34a" font-weight="700">IdP</text>
  <text x="916" y="238" font-size="12" fill="#6b7280">mock · Keycloak · Entra ID · Oracle IAM</text>
  <rect x="690" y="320" width="170" height="150" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="704" y="346" font-size="15" fill="#1f2937" font-weight="700">Browser</text>
  <text x="704" y="368" font-size="12.5" fill="#1f2937">Next.js pages (React)</text>
  <text x="704" y="386" font-size="12.5" fill="#1f2937">no tokens at all</text>
  <rect x="704" y="422" width="142" height="34" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.2"/>
  <text x="775.0" y="443.14" font-size="12" fill="#6b7280" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">http-only cookie</text>
  <rect x="910" y="320" width="190" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="924" y="346" font-size="14" fill="#2563eb" font-weight="700">Next.js server (BFF)</text>
  <text x="924" y="368" font-size="12" fill="#1f2937">session cookie ⇄ tokens</text>
  <text x="924" y="385" font-size="12" fill="#1f2937">encrypted (A256GCM)</text>
  <text x="924" y="402" font-size="12" fill="#1f2937">refresh on demand</text>
  <rect x="924" y="426" width="162" height="32" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.2"/>
  <text x="1005.0" y="446.14" font-size="12" fill="#d97706" font-weight="600" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">access · id · refresh</text>
  <rect x="1140" y="320" width="100" height="150" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="1152" y="346" font-size="14" fill="#2563eb" font-weight="700">REST /</text>
  <text x="1152" y="363" font-size="14" fill="#2563eb" font-weight="700">GraphQL</text>
  <text x="1152" y="380" font-size="14" fill="#2563eb" font-weight="700">API</text>
  <text x="1152" y="414" font-size="12" fill="#1f2937">same JWT</text>
  <text x="1152" y="431" font-size="12" fill="#1f2937">validation</text>
  <text x="1152" y="448" font-size="12" fill="#1f2937">as in A</text>
  <path d="M750,320 V233.0 H900" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#arr-grey)"/>
  <text x="758" y="226.0" font-size="12" fill="#6b7280">login page (redirect)</text>
  <line x1="960" y1="320" x2="960" y2="251" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <g><circle cx="960" cy="285.5" r="12" fill="#2563eb"/><text x="960" y="290.0" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text></g>
  <line x1="1030" y1="251" x2="1030" y2="320" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>
  <g><circle cx="1030" cy="285.5" r="12" fill="#d97706"/><text x="1030" y="290.0" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text></g>
  <line x1="860" y1="395" x2="910" y2="395" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <g><circle cx="885.0" cy="395" r="12" fill="#2563eb"/><text x="885.0" y="399.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text></g>
  <line x1="1100" y1="395" x2="1140" y2="395" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>
  <g><circle cx="1120.0" cy="395" r="12" fill="#d97706"/><text x="1120.0" y="399.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text></g>
  <line x1="1190" y1="320" x2="1190" y2="251" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr-green)"/>
  <g><circle cx="1190" cy="285.5" r="12" fill="#16a34a"/><text x="1190" y="290.0" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text></g>
  <text x="1206" y="289.5" font-size="12" fill="#16a34a">JWKS</text>
  <g><circle cx="712" cy="502" r="10" fill="#2563eb"/><text x="712" y="506.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text></g>
  <text x="732" y="506" font-size="12.5" fill="#1f2937">server builds /authorize with PKCE + state + nonce, browser is redirected</text>
  <g><circle cx="712" cy="526" r="10" fill="#d97706"/><text x="712" y="530.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text></g>
  <text x="732" y="530" font-size="12.5" fill="#1f2937">server exchanges the code with client_secret; tokens never reach the browser</text>
  <g><circle cx="712" cy="550" r="10" fill="#2563eb"/><text x="712" y="554.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text></g>
  <text x="732" y="554" font-size="12.5" fill="#1f2937">browser calls same-origin /api/bff/* with the encrypted http-only cookie</text>
  <g><circle cx="712" cy="574" r="10" fill="#d97706"/><text x="712" y="578.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text></g>
  <text x="732" y="578" font-size="12.5" fill="#1f2937">server forwards Authorization: Bearer &lt;access_token&gt; to the API</text>
  <g><circle cx="712" cy="598" r="10" fill="#16a34a"/><text x="712" y="602.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text></g>
  <text x="732" y="602" font-size="12.5" fill="#1f2937">API validates the JWT exactly like in A — one code path for both UIs</text>
  <text x="700" y="648" font-size="14" fill="#16a34a" font-weight="700">Pros</text>
  <text x="700" y="671" font-size="12.5" fill="#1f2937">+ tokens never reach the browser</text>
  <text x="700" y="691" font-size="12.5" fill="#1f2937">+ confidential client with a secret</text>
  <text x="700" y="711" font-size="12.5" fill="#1f2937">+ refresh + logout done server-side</text>
  <text x="700" y="731" font-size="12.5" fill="#1f2937">+ same-origin: no CORS, hides URLs</text>
  <text x="980" y="648" font-size="14" fill="#d97706" font-weight="700">Cons</text>
  <text x="980" y="671" font-size="12.5" fill="#1f2937">– needs a server + cookie secret</text>
  <text x="980" y="691" font-size="12.5" fill="#1f2937">– cookie ≤ 4 KB: drop id_token if big</text>
  <text x="980" y="711" font-size="12.5" fill="#1f2937">– CSRF hygiene: SameSite=Lax, POST</text>
  <text x="980" y="731" font-size="12.5" fill="#1f2937">– one more hop, more code</text>
  <text x="700" y="775" font-size="12.5" fill="#6b7280" font-style="italic">Use when the UI already has a server (SSR) or tokens must never be exposed.</text>
  <text x="650.0" y="828" font-size="13" fill="#6b7280" text-anchor="middle">In both cases the API validates the same access token the same way (see token-validation.svg).</text>
</svg>
