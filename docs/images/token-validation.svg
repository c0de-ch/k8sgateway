<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1170" viewBox="0 0 1300 1170" role="img" aria-labelledby="title desc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Token validation flow in a resource server</title>
  <desc id="desc">Flow chart of the checks an API performs on a Bearer JWT: header and alg allow-list, kid lookup in the cached JWKS, signature, issuer, audience, expiry with clock skew, roles from the configured claim, authorization, then 401, 403 or 200.</desc>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#2563eb"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#16a34a"/></marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#d97706"/></marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6b7280"/></marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#1f2937"/></marker>
  </defs>
  <!-- light canvas so the diagram stays legible on GitHub dark mode -->
  <rect x="0.5" y="0.5" width="1299" height="1169" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="50" font-size="24" fill="#1f2937" font-weight="700">What the resource server checks on every request</text>
  <text x="40" y="78" font-size="15" fill="#6b7280">Identical rules in the Go REST API (go-oidc) and the Node GraphQL API (jose) — driven only by the OIDC_* and ROLES_CLAIM environment variables.</text>
  <rect x="400" y="112" width="470" height="74" rx="37" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.6"/>
  <text x="422" y="139" font-size="14.5" fill="#1f2937" font-weight="700">Request arrives</text>
  <text x="422" y="159" font-size="12" fill="#6b7280">Authorization: Bearer &lt;JWT&gt;</text>
  <text x="422" y="175" font-size="12" fill="#6b7280">no header or wrong scheme → 401 right away</text>
  <line x1="635.0" y1="186" x2="635.0" y2="210" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="645.0" y="203" font-size="12" fill="#6b7280">ok</text>
  <rect x="400" y="210" width="470" height="74" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="422" y="237" font-size="14.5" fill="#1f2937" font-weight="700">1 · Parse the header — alg allow-list</text>
  <text x="422" y="257" font-size="12" fill="#6b7280">accept the RS256 family (RS/PS); reject none, HS*</text>
  <text x="422" y="273" font-size="12" fill="#6b7280">(HS* with a public key = key-confusion attack)</text>
  <line x1="635.0" y1="284" x2="635.0" y2="308" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="645.0" y="301" font-size="12" fill="#6b7280">ok</text>
  <line x1="870" y1="247.0" x2="920" y2="247.0" stroke="#d97706" stroke-width="1.6" marker-end="url(#arr-amber)"/>
  <text x="895.0" y="240.0" font-size="12" fill="#d97706" text-anchor="middle">fail</text>
  <rect x="920" y="224" width="360" height="46" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="934" y="243" font-size="13" fill="#d97706" font-weight="700">401 invalid_token</text>
  <text x="934" y="260" font-size="12" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">unsupported or missing alg</text>
  <rect x="400" y="308" width="470" height="74" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="422" y="335" font-size="14.5" fill="#1f2937" font-weight="700">2 · Find the key: kid → JWKS</text>
  <text x="422" y="355" font-size="12" fill="#6b7280">JWKS cached in memory; unknown kid → refetch once</text>
  <text x="422" y="371" font-size="12" fill="#6b7280">(key rotation), rate-limited; still unknown → fail</text>
  <line x1="635.0" y1="382" x2="635.0" y2="406" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="645.0" y="399" font-size="12" fill="#6b7280">ok</text>
  <line x1="870" y1="345.0" x2="920" y2="345.0" stroke="#d97706" stroke-width="1.6" marker-end="url(#arr-amber)"/>
  <text x="895.0" y="338.0" font-size="12" fill="#d97706" text-anchor="middle">fail</text>
  <rect x="920" y="322" width="360" height="46" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="934" y="341" font-size="13" fill="#d97706" font-weight="700">401 invalid_token</text>
  <text x="934" y="358" font-size="12" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">unknown kid / JWKS unavailable</text>
  <rect x="400" y="406" width="470" height="74" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="422" y="433" font-size="14.5" fill="#1f2937" font-weight="700">3 · Verify the signature</text>
  <text x="422" y="453" font-size="12" fill="#6b7280">RSA public key from the JWKS</text>
  <text x="422" y="469" font-size="12" fill="#6b7280">only now are the claims trustworthy</text>
  <line x1="635.0" y1="480" x2="635.0" y2="504" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="645.0" y="497" font-size="12" fill="#6b7280">ok</text>
  <line x1="870" y1="443.0" x2="920" y2="443.0" stroke="#d97706" stroke-width="1.6" marker-end="url(#arr-amber)"/>
  <text x="895.0" y="436.0" font-size="12" fill="#d97706" text-anchor="middle">fail</text>
  <rect x="920" y="420" width="360" height="46" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="934" y="439" font-size="13" fill="#d97706" font-weight="700">401 invalid_token</text>
  <text x="934" y="456" font-size="12" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">signature verification failed</text>
  <rect x="400" y="504" width="470" height="74" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="422" y="531" font-size="14.5" fill="#1f2937" font-weight="700">4 · iss == OIDC_ISSUER_CLAIM</text>
  <text x="422" y="551" font-size="12" fill="#6b7280">exact string match, e.g. …/&lt;TENANT_ID&gt;/v2.0 (Entra)</text>
  <text x="422" y="567" font-size="12" fill="#6b7280">or https://identity.oraclecloud.com/ (Oracle)</text>
  <line x1="635.0" y1="578" x2="635.0" y2="602" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="645.0" y="595" font-size="12" fill="#6b7280">ok</text>
  <line x1="870" y1="541.0" x2="920" y2="541.0" stroke="#d97706" stroke-width="1.6" marker-end="url(#arr-amber)"/>
  <text x="895.0" y="534.0" font-size="12" fill="#d97706" text-anchor="middle">fail</text>
  <rect x="920" y="518" width="360" height="46" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="934" y="537" font-size="13" fill="#d97706" font-weight="700">401 invalid_token</text>
  <text x="934" y="554" font-size="12" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">issuer mismatch (other IdP / tenant)</text>
  <rect x="400" y="602" width="470" height="74" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="422" y="629" font-size="14.5" fill="#1f2937" font-weight="700">5 · aud contains OIDC_AUDIENCE</text>
  <text x="422" y="649" font-size="12" fill="#6b7280">aud may be a string or an array</text>
  <text x="422" y="665" font-size="12" fill="#6b7280">a token minted for another API is rejected</text>
  <line x1="635.0" y1="676" x2="635.0" y2="700" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="645.0" y="693" font-size="12" fill="#6b7280">ok</text>
  <line x1="870" y1="639.0" x2="920" y2="639.0" stroke="#d97706" stroke-width="1.6" marker-end="url(#arr-amber)"/>
  <text x="895.0" y="632.0" font-size="12" fill="#d97706" text-anchor="middle">fail</text>
  <rect x="920" y="616" width="360" height="46" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="934" y="635" font-size="13" fill="#d97706" font-weight="700">401 invalid_token</text>
  <text x="934" y="652" font-size="12" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">audience mismatch</text>
  <rect x="400" y="700" width="470" height="74" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="422" y="727" font-size="14.5" fill="#1f2937" font-weight="700">6 · exp / nbf with 60 s clock skew</text>
  <text x="422" y="747" font-size="12" fill="#6b7280">expired or not-yet-valid tokens are rejected</text>
  <text x="422" y="763" font-size="12" fill="#6b7280">short TTLs limit the damage of a stolen token</text>
  <line x1="635.0" y1="774" x2="635.0" y2="798" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="645.0" y="791" font-size="12" fill="#6b7280">ok</text>
  <line x1="870" y1="737.0" x2="920" y2="737.0" stroke="#d97706" stroke-width="1.6" marker-end="url(#arr-amber)"/>
  <text x="895.0" y="730.0" font-size="12" fill="#d97706" text-anchor="middle">fail</text>
  <rect x="920" y="714" width="360" height="46" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="934" y="733" font-size="13" fill="#d97706" font-weight="700">401 invalid_token</text>
  <text x="934" y="750" font-size="12" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">token expired / not yet valid</text>
  <rect x="400" y="798" width="470" height="74" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="422" y="825" font-size="14.5" fill="#1f2937" font-weight="700">7 · roles ← ROLES_CLAIM (dotted path)</text>
  <text x="422" y="845" font-size="12" fill="#6b7280">e.g. realm_access.roles → array or space-separated string</text>
  <text x="422" y="861" font-size="12" fill="#6b7280">missing claim → [] — still authenticated</text>
  <line x1="635.0" y1="872" x2="635.0" y2="896" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="645.0" y="889" font-size="12" fill="#6b7280">ok</text>
  <rect x="400" y="896" width="470" height="74" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="422" y="923" font-size="14.5" fill="#1f2937" font-weight="700">8 · Authorize — RequireRole(user | admin)</text>
  <text x="422" y="943" font-size="12" fill="#6b7280">does this route need a role? does the token carry it?</text>
  <text x="422" y="959" font-size="12" fill="#6b7280">claims + roles go into the request context</text>
  <line x1="870" y1="933.0" x2="920" y2="933.0" stroke="#d97706" stroke-width="1.6" marker-end="url(#arr-amber)"/>
  <text x="895.0" y="926.0" font-size="12" fill="#d97706" text-anchor="middle">fail</text>
  <rect x="920" y="910" width="360" height="46" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/>
  <text x="934" y="929" font-size="13" fill="#d97706" font-weight="700">403 forbidden</text>
  <text x="934" y="946" font-size="12" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">{"error":"forbidden","required_role":"admin"}</text>
  <line x1="635.0" y1="970" x2="635.0" y2="994" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="645.0" y="987" font-size="12" fill="#6b7280">ok</text>
  <rect x="400" y="994" width="470" height="62" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="422" y="1020" font-size="14.5" fill="#16a34a" font-weight="700">200 — handler runs with the verified claims</text>
  <text x="422" y="1041" font-size="12" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">log one line per request: sub=… roles=[…] path=…</text>

  <!-- left-hand notes -->
  <rect x="40" y="268" width="320" height="150" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="56" y="294.5" font-size="14" fill="#16a34a" font-weight="700">JWKS — the IdP's public keys</text>
  <text x="56" y="316.5" font-size="12" fill="#16a34a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">GET {OIDC_ISSUER}/.well-known/</text>
  <text x="56" y="334.5" font-size="12" fill="#16a34a" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">openid-configuration → jwks_uri</text>
  <text x="56" y="352.5" font-size="12" fill="#1f2937">or OIDC_JWKS_URI (e.g. an in-cluster URL)</text>
  <text x="56" y="370.5" font-size="12" fill="#1f2937">cached; keys rotate → refetch on unknown kid</text>
  <text x="56" y="388.5" font-size="12" fill="#1f2937">public keys only: no secret is shared</text>
  <line x1="360" y1="345" x2="400" y2="345" stroke="#16a34a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr-green)"/>
  <rect x="40" y="494" width="320" height="170" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
  <text x="56" y="520.5" font-size="14" fill="#1f2937" font-weight="700">Why these three claims</text>
  <text x="56" y="542.5" font-size="12.5" fill="#1f2937" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">iss</text>
  <text x="56" y="560.5" font-size="12" fill="#1f2937">the token really comes from our IdP / tenant</text>
  <text x="56" y="578.5" font-size="12.5" fill="#1f2937" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">aud</text>
  <text x="56" y="596.5" font-size="12" fill="#1f2937">minted for this API, not for another app or API</text>
  <text x="56" y="614.5" font-size="12.5" fill="#1f2937" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">exp / nbf</text>
  <text x="56" y="632.5" font-size="12" fill="#1f2937">short lifetime + refresh tokens limit replay</text>
  <rect x="40" y="788" width="320" height="150" rx="12" fill="#ffffff" stroke="#6b7280" stroke-width="1.6"/>
  <text x="56" y="814.5" font-size="14" fill="#1f2937" font-weight="700">ROLES_CLAIM per IdP</text>
  <text x="56" y="836.5" font-size="12" fill="#2563eb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">roles</text>
  <text x="56" y="854.5" font-size="12" fill="#1f2937">mock IdP (generic), Microsoft Entra ID (app roles)</text>
  <text x="56" y="872.5" font-size="12" fill="#2563eb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">realm_access.roles</text>
  <text x="56" y="890.5" font-size="12" fill="#1f2937">Keycloak realm roles</text>
  <text x="56" y="908.5" font-size="12" fill="#2563eb" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">groups*</text>
  <text x="56" y="926.5" font-size="12" fill="#1f2937">Oracle IAM (*verify with a decoded token)</text>

  <!-- footer: response shapes -->
  <text x="40" y="1114" font-size="12.5" fill="#6b7280">Every 401 carries  WWW-Authenticate: Bearer error="invalid_token", error_description="…"  and the JSON body  {"error":"unauthorized","error_description":"…"}.</text>
  <text x="40" y="1134" font-size="12.5" fill="#6b7280">The API never leaks stack traces or the reason in detail to anonymous callers; details go to the structured log line.</text>
</svg>
