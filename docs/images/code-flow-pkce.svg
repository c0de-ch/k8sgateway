<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1361" viewBox="0 0 1300 1361" role="img" aria-labelledby="title desc" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title id="title">Authorization Code Flow with PKCE between browser, IdP and REST API</title>
  <desc id="desc">Nine numbered steps: the SPA creates a PKCE verifier and challenge, redirects to the IdP, the user logs in, the browser returns with a code, exchanges it for tokens, calls the API with a Bearer token and the API validates it via JWKS.</desc>
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#2563eb"/></marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#16a34a"/></marker>
    <marker id="arr-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#d97706"/></marker>
    <marker id="arr-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#6b7280"/></marker>
    <marker id="arr-slate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 Z" fill="#1f2937"/></marker>
  </defs>
  <!-- light canvas so the diagram stays legible on GitHub dark mode -->
  <rect x="0.5" y="0.5" width="1299" height="1360" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="40" y="50" font-size="24" fill="#1f2937" font-weight="700">Authorization Code Flow with PKCE — how the SPA gets tokens and calls the API</text>
  <text x="40" y="78" font-size="15" fill="#6b7280">Public client (Angular): no client secret. PKCE binds the code to this browser, state protects the redirect, nonce binds the ID token to this login.</text>
  <rect x="100.0" y="104" width="220" height="56" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="210" y="128" font-size="15" fill="#2563eb" font-weight="700" text-anchor="middle">Browser · Angular SPA</text>
  <text x="210" y="147" font-size="12" fill="#6b7280" text-anchor="middle">public client</text>
  <rect x="610.0" y="104" width="220" height="56" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="720" y="128" font-size="15" fill="#16a34a" font-weight="700" text-anchor="middle">Identity Provider</text>
  <text x="720" y="147" font-size="12" fill="#6b7280" text-anchor="middle">mock / Keycloak / Entra / Oracle</text>
  <rect x="1010.0" y="104" width="220" height="56" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="1120" y="128" font-size="15" fill="#2563eb" font-weight="700" text-anchor="middle">REST API (Go)</text>
  <text x="1120" y="147" font-size="12" fill="#6b7280" text-anchor="middle">resource server</text>
  <line x1="210" y1="160" x2="210" y2="1275" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 6"/>
  <line x1="720" y1="160" x2="720" y2="1275" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 6"/>
  <line x1="1120" y1="160" x2="1120" y2="1275" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="6 6"/>

  <!-- phase 1: sign-in (once per session) -->
  <path d="M210,196 H244 V226 H222" fill="none" stroke="#2563eb" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-blue)"/>
  <g><circle cx="180" cy="211" r="12" fill="#2563eb"/><text x="180" y="215.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text></g>
  <text x="260" y="201" font-size="13.5" fill="#1f2937" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">generate code_verifier (random 43–128 chars)</text>
  <text x="260" y="220" font-size="12" fill="#2563eb" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">code_challenge = BASE64URL( SHA-256(code_verifier) )</text>
  <g><circle cx="232" cy="268" r="12" fill="#2563eb"/><text x="232" y="272.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text></g>
  <text x="254" y="273" font-size="13.5" fill="#1f2937" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round" font-weight="700">GET /authorize — redirect the browser to the IdP</text>
  <text x="254" y="292" font-size="12" fill="#6b7280" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">response_type=code  client_id=angular-app</text>
  <text x="254" y="311" font-size="12" fill="#6b7280" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">redirect_uri=…/callback  state=&lt;random&gt;  nonce=&lt;random&gt;</text>
  <text x="254" y="330" font-size="12" fill="#6b7280" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">scope=openid profile email  (+offline_access: Entra/Oracle only)</text>
  <text x="254" y="349" font-size="12" fill="#6b7280" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">code_challenge=&lt;challenge&gt;  code_challenge_method=S256</text>
  <line x1="210" y1="361" x2="720" y2="361" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M720,397 H754 V427 H732" fill="none" stroke="#16a34a" stroke-width="2" stroke-linejoin="round" marker-end="url(#arr-green)"/>
  <g><circle cx="690" cy="412" r="12" fill="#16a34a"/><text x="690" y="416.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text></g>
  <text x="770" y="402" font-size="13.5" fill="#1f2937" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round" font-weight="700">user signs in on the IdP's login page</text>
  <text x="770" y="421" font-size="12.5" fill="#6b7280" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">password, MFA, SSO cookie, social login …</text>
  <text x="770" y="440" font-size="12.5" fill="#6b7280" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">the application never sees the credentials</text>
  <text x="770" y="459" font-size="12.5" fill="#6b7280" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">IdP stores code_challenge next to a one-time code</text>
  <g><circle cx="232" cy="504" r="12" fill="#16a34a"/><text x="232" y="508.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text></g>
  <text x="254" y="509" font-size="13.5" fill="#1f2937" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round" font-weight="700">302 → redirect_uri?code=&lt;one-time code&gt;&amp;state=&lt;state&gt;</text>
  <text x="254" y="528" font-size="12.5" fill="#6b7280" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">SPA checks state == the value it stored (CSRF protection)</text>
  <text x="254" y="547" font-size="12.5" fill="#6b7280" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">the code is single-use and expires after ~60 s</text>
  <line x1="720" y1="559" x2="210" y2="559" stroke="#16a34a" stroke-width="2" marker-end="url(#arr-green)"/>
  <g><circle cx="232" cy="597" r="12" fill="#2563eb"/><text x="232" y="601.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text></g>
  <text x="254" y="602" font-size="13.5" fill="#1f2937" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round" font-weight="700">POST /token — exchange the code (browser → IdP, CORS)</text>
  <text x="254" y="621" font-size="12" fill="#6b7280" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">grant_type=authorization_code  code=&lt;code&gt;</text>
  <text x="254" y="640" font-size="12" fill="#6b7280" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">code_verifier=&lt;verifier&gt;  redirect_uri=…/callback</text>
  <text x="254" y="659" font-size="12" fill="#6b7280" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">client_id=angular-app   (public client: no client_secret)</text>
  <line x1="210" y1="671" x2="720" y2="671" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <g><circle cx="232" cy="709" r="12" fill="#d97706"/><text x="232" y="713.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">6</text></g>
  <text x="254" y="714" font-size="13.5" fill="#d97706" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round" font-weight="700">200 { access_token, id_token, refresh_token, expires_in }</text>
  <text x="254" y="733" font-size="12.5" fill="#6b7280" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">IdP checked SHA-256(code_verifier) == code_challenge (PKCE)</text>
  <text x="254" y="752" font-size="12.5" fill="#6b7280" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">SPA checks the id_token: nonce == stored nonce, iss, aud == client_id</text>
  <line x1="720" y1="764" x2="210" y2="764" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>

  <!-- phase 2: every API call -->
  <g><circle cx="232" cy="818" r="12" fill="#d97706"/><text x="232" y="822.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">7</text></g>
  <text x="254" y="823" font-size="13.5" fill="#d97706" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round" font-weight="700">GET /api/orders   Authorization: Bearer &lt;access_token&gt;</text>
  <text x="254" y="842" font-size="12.5" fill="#6b7280" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">the access token is meant for the API (aud = k8sgateway-api); the SPA only decodes it for UI hints (roles) — the API enforces</text>
  <line x1="210" y1="854" x2="1120" y2="854" stroke="#d97706" stroke-width="2" marker-end="url(#arr-amber)"/>
  <g><circle cx="742" cy="892" r="12" fill="#16a34a"/><text x="742" y="896.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">8</text></g>
  <text x="764" y="897" font-size="13.5" fill="#1f2937" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round" font-weight="700">fetch the signing keys (once, then cached)</text>
  <text x="764" y="916" font-size="12" fill="#6b7280" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">GET /.well-known/openid-configuration</text>
  <text x="764" y="935" font-size="12" fill="#6b7280" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">→ jwks_uri → GET &lt;jwks_uri&gt;</text>
  <text x="764" y="954" font-size="12.5" fill="#6b7280" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">refetched once when a kid is unknown</text>
  <line x1="1120" y1="966" x2="720" y2="966" stroke="#16a34a" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-green)"/>
  <rect x="940" y="988" width="330" height="150" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="954" y="1010" font-size="12.5" fill="#1f2937" font-weight="700">validate the JWT → token-validation.svg</text>
  <text x="954" y="1028" font-size="12.5" fill="#1f2937">• signature with the JWKS key (RS256 family)</text>
  <text x="954" y="1046" font-size="12.5" fill="#1f2937">• iss == OIDC_ISSUER_CLAIM</text>
  <text x="954" y="1064" font-size="12.5" fill="#1f2937">• aud contains OIDC_AUDIENCE</text>
  <text x="954" y="1082" font-size="12.5" fill="#1f2937">• exp / nbf with 60 s clock skew</text>
  <text x="954" y="1100" font-size="12.5" fill="#1f2937">• roles ← ROLES_CLAIM (dotted path)</text>
  <text x="954" y="1118" font-size="12.5" fill="#1f2937">• RequireRole(user) for /api/orders</text>
  <g><circle cx="232" cy="1186" r="12" fill="#2563eb"/><text x="232" y="1190.5" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">9</text></g>
  <text x="254" y="1191" font-size="13.5" fill="#1f2937" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round" font-weight="700">200 OK + JSON     ·     401 invalid_token     ·     403 forbidden</text>
  <text x="254" y="1210" font-size="12" fill="#6b7280" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">401 → WWW-Authenticate: Bearer error="invalid_token", error_description="…"</text>
  <text x="254" y="1229" font-size="12" fill="#6b7280" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">403 → {"error":"forbidden","required_role":"user"}</text>
  <line x1="1120" y1="1241" x2="210" y2="1241" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- phase bands and labels (left margin) -->
  <rect x="40" y="180" width="8" height="602" rx="4" fill="#f3f4f6" stroke="#e2e8f0" stroke-width="1"/>
  <text x="66" y="481.0" font-size="12.5" fill="#6b7280" font-weight="700" text-anchor="middle" transform="rotate(-90 66 481.0)">SIGN-IN · once per session</text>
  <rect x="40" y="790" width="8" height="469" rx="4" fill="#f3f4f6" stroke="#e2e8f0" stroke-width="1"/>
  <text x="66" y="1024.5" font-size="12.5" fill="#6b7280" font-weight="700" text-anchor="middle" transform="rotate(-90 66 1024.5)">API CALLS · every request</text>

  <!-- footer -->
  <text x="40" y="1309" font-size="12.5" fill="#6b7280">Refresh: when the access token expires the SPA calls POST /token with grant_type=refresh_token (silent refresh, no user interaction). Logout: GET end_session_endpoint?id_token_hint=…</text>
  <text x="40" y="1329" font-size="12.5" fill="#6b7280">Next.js (BFF) runs steps 1, 2, 5 and 6 on the server with a client_secret and keeps the tokens in an encrypted http-only cookie — see bff-vs-spa.svg.</text>
</svg>
