# One Ingress per hostname - the Ingress equivalent of the HTTPRoutes in
# deploy/base/*/httproute.yaml and deploy/idp/*/httproute.yaml. Host-based
# routing, path "/" - nothing else is needed for this tutorial.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: angular-app
  namespace: k8sgateway
  labels:
    app.kubernetes.io/name: angular-app
    app.kubernetes.io/part-of: k8sgateway
spec:
  ingressClassName: traefik
  rules:
    - host: angular.127.0.0.1.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: angular-app
                port:
                  number: 8080
