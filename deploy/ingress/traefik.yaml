# A plain Ingress controller (Traefik v3) as an ALTERNATIVE to the Gateway API
# setup in deploy/gateway. Applied by scripts/ingress-mode.sh on, which first
# removes the Gateway so that the NodePorts 30080/30443 (host ports 80/443 in
# deploy/kind/kind-config.yaml) are free. Only the Kubernetes Ingress provider
# is enabled: no Traefik CRDs, no dashboard - just Ingress resources.
apiVersion: v1
kind: Namespace
metadata:
  name: ingress
  labels:
    app.kubernetes.io/name: ingress
    app.kubernetes.io/part-of: k8sgateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: ingress
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: k8sgateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-ingress
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: k8sgateway
rules:
  - apiGroups: [""]
    resources: [services, secrets, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik-ingress
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: k8sgateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik-ingress
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: ingress
---
# The class every Ingress in deploy/ingress/ingresses.yaml refers to.
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: traefik
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: k8sgateway
spec:
  controller: traefik.io/ingress-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: ingress
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: k8sgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: traefik
  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/part-of: k8sgateway
    spec:
      serviceAccountName: traefik
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: traefik
          image: traefik:v3.7.13
          args:
            - --entrypoints.web.address=:8000        # plain http, Service port 80
            - --entrypoints.websecure.address=:8443  # https, Service port 443 (needs a TLS secret per Ingress)
            - --entrypoints.traefik.address=:9000    # ping / health only, not exposed
            - --ping=true
            - --ping.entrypoint=traefik
            - --providers.kubernetesingress=true
            - --providers.kubernetesingress.ingressclass=traefik
            - --providers.kubernetesingress.ingressendpoint.publishedservice=ingress/traefik
            - --accesslog=true
            - --log.level=INFO
          ports:
            - name: web
              containerPort: 8000
            - name: websecure
              containerPort: 8443
            - name: traefik
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /ping
              port: traefik
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: traefik
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
---
# Same NodePorts as the Envoy proxy Service in Gateway mode, so the kind port
# mappings (host 80/443) keep working unchanged.
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: ingress
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/part-of: k8sgateway
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: traefik
  ports:
    - name: web
      port: 80
      targetPort: web
      nodePort: 30080
    - name: websecure
      port: 443
      targetPort: websecure
      nodePort: 30443
