apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: angular-app
  namespace: k8sgateway
  labels:
    app.kubernetes.io/name: angular-app
    app.kubernetes.io/part-of: k8sgateway
spec:
  parentRefs:
    - name: main
      namespace: k8sgateway
  hostnames:
    - angular.127.0.0.1.nip.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: angular-app
          port: 8080
