apiVersion: apps/v1
kind: Deployment
metadata:
  name: angular-app
  namespace: k8sgateway
  labels:
    app.kubernetes.io/name: angular-app
    app.kubernetes.io/part-of: k8sgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: angular-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: angular-app
        app.kubernetes.io/part-of: k8sgateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # nginx user of the unprivileged nginx image
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: angular-app
          image: k8sgateway/angular-app:dev
          imagePullPolicy: IfNotPresent # image is loaded into kind, never pulled
          ports:
            - name: http
              containerPort: 8080
          # The SPA reads /config.json at startup. The file is a ConfigMap
          # generated by the overlay, mounted over the copy baked into the image.
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: angular-config
