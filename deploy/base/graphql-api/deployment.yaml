apiVersion: apps/v1
kind: Deployment
metadata:
  name: graphql-api
  namespace: k8sgateway
  labels:
    app.kubernetes.io/name: graphql-api
    app.kubernetes.io/part-of: k8sgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: graphql-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: graphql-api
        app.kubernetes.io/part-of: k8sgateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # "node" user of the official node image
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: graphql-api
          image: k8sgateway/graphql-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
          env:
            # Optional TLS mode (scripts/tls-setup.sh): the local CA that signed the
            # gateway certificate, so the app can talk to an https:// issuer.
            # Node adds it to the system roots; an empty file changes nothing.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/k8sgateway-ca/ca.crt
          envFrom:
            - configMapRef:
                name: graphql-api-config
          volumeMounts:
            - name: ca
              mountPath: /etc/k8sgateway-ca
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: ca
          configMap:
            name: k8sgateway-ca # empty until scripts/tls-setup.sh puts the local CA in it
            optional: true
