# Everything that is identical for every identity provider: the four
# applications, their Services and HTTPRoutes. IdP-specific configuration
# (issuer, client ids, roles claim) is generated by deploy/overlays/<idp>.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - angular-app
  - nextjs-app
  - rest-api
  - graphql-api
