# Exposes Keycloak as http://keycloak.127.0.0.1.nip.io. For the tutorial the
# whole server (including /admin/) is routed; in production expose only
# /realms/<realm>/ and /resources/ and keep the admin console internal.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: idp
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: k8sgateway
spec:
  parentRefs:
    - name: main
      namespace: k8sgateway
  hostnames:
    - keycloak.127.0.0.1.nip.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: keycloak
          port: 8080
