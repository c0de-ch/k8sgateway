apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-idp
  namespace: idp
  labels:
    app.kubernetes.io/name: mock-idp
    app.kubernetes.io/part-of: k8sgateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mock-idp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mock-idp
        app.kubernetes.io/part-of: k8sgateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # "node" user of the official node image
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mock-idp
          image: k8sgateway/mock-idp:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: mock-idp-config
          volumeMounts:
            - name: users
              mountPath: /config
              readOnly: true
            # RSA signing key, Secret mock-idp-key (scripts/deploy.sh creates it with
            # openssl). A persistent key keeps the JWKS "kid" stable across restarts,
            # so APIs and the gateway that cached the JWKS keep accepting tokens.
            - name: signing-key
              mountPath: /keys
              readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: users
          configMap:
            name: mock-idp-users
        - name: signing-key
          secret:
            secretName: mock-idp-key
            optional: true # without the Secret the pod starts with an ephemeral key
