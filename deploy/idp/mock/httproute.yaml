# Exposes the mock IdP as http://idp.127.0.0.1.nip.io through the shared
# Gateway (namespace k8sgateway), which allows routes from every namespace.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mock-idp
  namespace: idp
  labels:
    app.kubernetes.io/name: mock-idp
    app.kubernetes.io/part-of: k8sgateway
spec:
  parentRefs:
    - name: main
      namespace: k8sgateway
  hostnames:
    - idp.127.0.0.1.nip.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: mock-idp
          port: 8080
